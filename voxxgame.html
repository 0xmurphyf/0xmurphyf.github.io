<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Transcendence: The Call of the Abyss</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', 'Arial', sans-serif;
        }
        
        body {
            background-image: url('https://pbs.twimg.com/profile_banners/1886471135686221826/1739836394/1500x500');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(10, 10, 15, 0.85);
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.3);
            margin-top: 20px;
            border: 1px solid rgba(0, 150, 255, 0.5);
        }
        
        h1 {
            text-align: center;
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #0096ff;
            letter-spacing: 3px;
            color: #ffcc00;
            font-weight: 700;
            line-height: 1.2;
        }
        
        .title-line1 {
            display: block;
        }
        
        .title-line2 {
            display: block;
            font-size: 2.2rem;
            margin-top: 5px;
        }
        
        .subtitle {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #70d6ff;
            font-style: italic;
            overflow: hidden;
            white-space: nowrap;
            animation: marquee 25s linear infinite;
        }
        
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 150, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 150, 255, 0.5);
        }
        
        .social-icon:hover {
            transform: translateY(-5px);
            background: rgba(0, 150, 255, 0.4);
            box-shadow: 0 5px 15px rgba(0, 150, 255, 0.3);
        }
        
        .social-icon a {
            color: #70d6ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        
        .developer-info {
            text-align:right;
            margin-top: 30px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            font-size: 0.9rem;
            color: #a0d2ff;
        }
        
        .developer-info a {
            color: #4dabf7;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .developer-info a:hover {
            color: #70d6ff;
            text-decoration: underline;
        }
        
        .game-screen {
            display: none;
        }
        
        .active {
            display: block;
        }
        
        /* 角色选择界面 */
        .character-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .character-card {
            background: rgba(30, 30, 45, 0.7);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 150, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .character-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 150, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .character-card:hover::before {
            left: 100%;
        }
        
        .character-card:hover {
            transform: translateY(-5px);
            background: rgba(40, 40, 60, 0.8);
            border-color: #0096ff;
            box-shadow: 0 5px 15px rgba(0, 150, 255, 0.3);
        }
        
        .character-card.selected {
            background: rgba(0, 100, 150, 0.3);
            border-color: #00a8ff;
            box-shadow: 0 0 20px rgba(0, 168, 255, 0.5);
        }
        
        .character-icon {
            width: 150px; /* 增大图标尺寸 */
            height: 150px; /* 增大图标尺寸 */
            border-radius: 50%;
            margin: 10px auto;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 150, 255, 0.5);
            position: relative;
        }
        
        .character-icon::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00a8ff, #0096ff, #0077b6);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.7;
        }
        
        .character-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        
        .character-icon-text {
            font-size: 3rem;
        }
        
        .character-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #70d6ff;
        }
        
        .character-stats {
            font-size: 0.9rem;
            opacity: 0.8;
            color: #a0d2ff;
        }
        
        .character-description {
            font-size: 0.85rem;
            margin-top: 8px;
            opacity: 0.7;
            color: #b8e1ff;
            font-style: italic;
        }
        
        /* 战斗界面 */
        .battle-area {
            display: flex;
            flex-direction: column;
            margin: 30px 0;
            gap: 30px;
            position: relative;
            min-height: 400px;
        }
        
        .opponent-area, .player-area {
            text-align: center;
            padding: 20px;
            background: rgba(20, 20, 35, 0.7);
            border-radius: 8px;
            position: relative;
            border: 1px solid rgba(0, 150, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s ease;
        }
        
        .opponent-area::before, .player-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00a8ff, transparent);
        }
        
        .opponent-name {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ff6b6b;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }
        
        .player-name {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #4dabf7;
            text-shadow: 0 0 10px rgba(77, 171, 247, 0.5);
        }
        
        .hp-bar-container {
            width: 100%;
            height: 25px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            margin: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        
        .hp-bar {
            height: 100%;
            background: linear-gradient(to right, #ff6b6b, #ff8e8e);
            border-radius: 12px;
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }
        
        .hp-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shine 2s infinite;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .player-hp-bar {
            background: linear-gradient(to right, #4dabf7, #74c0fc);
        }
        
        .hp-text {
            font-size: 1.1rem;
            margin-top: 5px;
            color: #b8e1ff;
        }
        
        .action-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        
        .action-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: rgba(30, 30, 45, 0.7);
            color: white;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(0, 150, 255, 0.5);
        }
        
        .action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(0, 150, 255, 0.3), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .action-btn:hover:not(:disabled) {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
        }
        
        .action-btn:hover:not(:disabled)::before {
            opacity: 1;
        }
        
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .action-btn.rock { 
            background: rgba(80, 80, 100, 0.7);
            border-color: #888;
        }
        .action-btn.paper { 
            background: rgba(60, 100, 180, 0.7);
            border-color: #6495ed;
        }
        .action-btn.scissors { 
            background: rgba(180, 100, 40, 0.7);
            border-color: #ffa500;
        }
        
        .action-btn.selected {
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            transform: scale(1.1);
            border-color: gold;
        }
        
        .confirm-area {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        
        .confirm-btn {
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(to right, #0077b6, #0096ff);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .confirm-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .confirm-btn:hover:not(:disabled)::before {
            left: 100%;
        }
        
        .confirm-btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
        }
        
        .confirm-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 150, 255, 0.5);
        }
        
        /* 战斗日志 */
        .battle-log {
            background: rgba(10, 15, 25, 0.8);
            border-radius: 8px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            margin-top: 20px;
            font-size: 1.1rem;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0, 150, 255, 0.3);
        }
        
        .battle-log::-webkit-scrollbar {
            width: 8px;
        }
        
        .battle-log::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }
        
        .battle-log::-webkit-scrollbar-thumb {
            background: rgba(0, 150, 255, 0.5);
            border-radius: 4px;
        }
        
        .log-entry {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 6px;
            opacity: 0;
            transform: translateY(10px);
            animation: logAppear 0.5s forwards;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: flex-start;
            transition: all 0.3s ease;
            border-left: 4px solid;
        }
        
        .log-entry:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        @keyframes logAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .log-icon {
            margin-right: 10px;
            font-size: 1.2rem;
        }
        
        .log-content {
            flex: 1;
        }
        
        .log-entry.player {
            background: rgba(30, 60, 100, 0.3);
            border-left-color: #4dabf7;
        }
        
        .log-entry.opponent {
            background: rgba(100, 30, 30, 0.3);
            border-left-color: #ff6b6b;
        }
        
        .log-entry.system {
            background: rgba(100, 100, 30, 0.3);
            border-left-color: #ffcc00;
        }
        
        .log-entry.damage {
            background: rgba(150, 30, 30, 0.3);
            border-left-color: #ff0000;
        }
        
        .control-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(to right, #0077b6, #0096ff);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 150, 255, 0.5);
        }
        
        .btn-restart {
            background: linear-gradient(to right, #00b4d8, #0096ff);
        }
        
        .result-screen {
            text-align: center;
            padding: 40px;
        }
        
        .result-message {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.8);
            white-space: pre-line;
        }
        
        .victory {
            color: #4dabf7;
        }
        
        .defeat {
            color: #ff6b6b;
        }
        
        /* 伤害数字效果 */
        .damage-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            z-index: 20;
            color: #ff5555;
            opacity: 0;
            animation: damageAppear 1.5s forwards;
        }
        
        @keyframes damageAppear {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.5);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
        }
        
        /* 攻击动画 */
        @keyframes playerAttack {
            0% { transform: translateY(0); }
            50% { transform: translateY(-100px); }
            100% { transform: translateY(0); }
        }
        
        @keyframes opponentAttack {
            0% { transform: translateY(0); }
            50% { transform: translateY(100px); }
            100% { transform: translateY(0); }
        }
        
        .player-attacking {
            animation: playerAttack 0.6s ease;
        }
        
        .opponent-attacking {
            animation: opponentAttack 0.6s ease;
        }
        
        /* 回合信息 */
        .round-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.8);
            animation: roundAppear 1s forwards;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 40px;
            border-radius: 15px;
            color: #00a8ff;
            border: 1px solid rgba(0, 150, 255, 0.5);
        }
        
        @keyframes roundAppear {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
        }
        
        /* 平局信息 */
        .draw-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.8);
            animation: drawAppear 1s forwards;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 40px;
            border-radius: 15px;
            color: #ffcc00;
            border: 1px solid rgba(255, 204, 0, 0.5);
        }
        
        @keyframes drawAppear {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
        }
        
        /* 对手选择显示 */
        .opponent-choice {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 3rem;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            border: 2px solid rgba(255, 107, 107, 0.5);
        }
        
        .opponent-choice.show {
            opacity: 1;
        }
        
        /* 头像上传 */
        .avatar-upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            padding: 15px;
            background: rgba(20, 25, 35, 0.7);
            border-radius: 8px;
            border: 1px solid rgba(0, 150, 255, 0.3);
        }
        
        .avatar-preview {
            width: 150px; /* 增大图标尺寸 */
            height: 150px; /* 增大图标尺寸 */
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 15px;
            border: 3px solid #00a8ff;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .avatar-preview.default {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            background: rgba(0, 100, 150, 0.3);
        }
        
        .upload-btn {
            padding: 10px 20px;
            background: linear-gradient(to right, #0077b6, #0096ff);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .upload-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .upload-btn:hover::before {
            left: 100%;
        }
        
        .upload-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 150, 255, 0.3);
        }
        
        .upload-btn input {
            display: none;
        }
        
        /* 背景动画 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.1;
        }
        
        .pixel {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00a8ff;
            animation: float 15s infinite linear;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .battle-area {
                flex-direction: column;
            }
            
            .action-area {
                flex-wrap: wrap;
            }
            
            .character-selection {
                grid-template-columns: 1fr;
            }
            
            .opponent-choice {
                right: 10px;
                width: 60px;
                height: 60px;
                font-size: 2.5rem;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .title-line1 {
                font-size: 2.4rem;
            }
            
            .title-line2 {
                font-size: 1.8rem;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

    <h1>
        <span class="title-line1">Dark Transcendence</span>
        <span class="title-line2">The Call of the Abyss</span>
    </h1>
    <p class="subtitle">You don't need to die. You need to evolve!</p>

        <div class="social-icon">
            <a href="https://bento.me/voxxinc" target="_blank">
                <i class="fas fa-globe"></i>
            </a>
        </div>
    </div>
    
    <div class="container">
        <!-- 角色选择界面 -->
        <div id="characterSelectScreen" class="game-screen active">
            <h2>Select Your Opponent</h2>
            <div class="character-selection">
                <!-- 角色卡片将通过JS动态生成 -->
            </div>
            
            <div class="avatar-upload">
                <div id="avatarPreview" class="avatar-preview default">👤</div>
                <label class="upload-btn">
                    Upload Resistance Avatar
                    <input type="file" id="avatarUpload" accept="image/*">
                </label>
            </div>
            
            <div class="confirm-area">
                <button id="startBattleButton" class="confirm-btn" disabled>Start Battle</button>
            </div>
        </div>
        
        <!-- 战斗界面 -->
        <div id="battleScreen" class="game-screen">
            <div class="battle-area">
                <div class="opponent-area" id="opponentArea">
                    <div id="opponentName" class="opponent-name">Opponent</div>
                    <div id="opponentIcon" class="character-icon">
                        <div class="character-icon-text">👤</div>
                    </div>
                    <div class="opponent-choice" id="opponentChoice"></div>
                    <div class="hp-bar-container">
                        <div id="opponentHpBar" class="hp-bar" style="width: 100%"></div>
                    </div>
                    <div id="opponentHpText" class="hp-text">HP: 100/100</div>
                </div>
                
                <div class="player-area" id="playerArea">
                    <div class="player-name">Resistance Fighter</div>
                    <div id="playerIcon" class="character-icon">
                        <div class="character-icon-text">👤</div>
                    </div>
                    <div class="hp-bar-container">
                        <div id="playerHpBar" class="hp-bar player-hp-bar" style="width: 100%"></div>
                    </div>
                    <div id="playerHpText" class="hp-text">HP: 100/100</div>
                </div>
            </div>
            
            <div class="action-area">
                <button class="action-btn rock" data-choice="rock">✊</button>
                <button class="action-btn paper" data-choice="paper">✋</button>
                <button class="action-btn scissors" data-choice="scissors">✌️</button>
            </div>
            
            <div class="confirm-area">
                <button id="confirmButton" class="confirm-btn" disabled>Confirm</button>
            </div>
            
            <div class="battle-log" id="battleLog">
                <!-- 战斗日志将通过JS动态生成 -->
            </div>
            
            <div class="control-buttons">
                <button id="backButton" class="btn">Back</button>
            </div>
        </div>
        
        <!-- 结果界面 -->
        <div id="resultScreen" class="game-screen">
            <div class="result-screen">
                <div id="resultMessage" class="result-message"></div>
                <button id="restartButton" class="btn btn-restart">Play Again</button>
            </div>
        </div>
        
        <div class="developer-info">
        Developed by <a href="https://x.com/Murphyf919" target="_blank">Murphyf919</a></div>
    </div>

    <script>
        // 角色数据
        const characters = [
            {
                id: 'player',
                name: 'Player',
                icon: '👤',
                hp: 100,
                maxHp: 100,
                attack: 20,
                description: 'Brave challenger',
                imageUrl: null
            },
            {
                id: 'purist',
                name: 'Purist',
                icon: '😇',
                hp: 100,
                maxHp: 100,
                attack: 20,
                description: 'Devoted warrior',
                imageUrl: 'https://walrus.tusky.io/_4xidXZbFTU9O4iQ05jK1iu3SBYYe6AxBRvOPJmkirc'
            },
            {
                id: 'transcender',
                name: 'Transcendent',
                icon: '🤖',
                hp: 150,
                maxHp: 150,
                attack: 30,
                description: 'Powerful entity',
                imageUrl: 'https://walrus.tusky.io/XMEp2CioLPMp-eweQv519HI2Trd3AyKg3wF5xuiHnm8'
            },
            {
                id: 'failed',
                name: 'Wara',
                icon: '👹',
                hp: 30,
                maxHp: 30,
                attack: 80,
                description: 'Dangerous opponent',
                imageUrl: 'https://walrus.tusky.io/Y_ABbEvgSCddcCBBv0R_9f8teODwuTx11OiqjZ84nfE'
            }
        ];
        
        // 游戏状态
        const gameState = {
            currentScreen: 'characterSelect',
            player: {...characters[0]},
            opponent: null,
            battleLog: [],
            round: 1,
            lastLogTime: Date.now(),
            userScrolledLog: false,
            playerChoice: null,
            opponentChoice: null,
            playerAvatar: null,
            selectedOpponent: null
        };
        
        // DOM元素
        const screens = {
            characterSelect: document.getElementById('characterSelectScreen'),
            battle: document.getElementById('battleScreen'),
            result: document.getElementById('resultScreen')
        };
        
        // 初始化游戏
        function initGame() {
            createBackgroundAnimation();
            renderCharacterSelection();
            setupEventListeners();
        }
        
        // 创建背景动画
        function createBackgroundAnimation() {
            const bgAnimation = document.getElementById('bgAnimation');
            for (let i = 0; i < 100; i++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                pixel.style.left = `${Math.random() * 100}%`;
                pixel.style.top = `${Math.random() * 100}%`;
                pixel.style.animationDelay = `${Math.random() * 15}s`;
                bgAnimation.appendChild(pixel);
            }
        }
        
        // 渲染角色选择界面
        function renderCharacterSelection() {
            const container = document.querySelector('.character-selection');
            container.innerHTML = '';
            
            characters.slice(1).forEach(char => {
                const card = document.createElement('div');
                card.className = 'character-card';
                card.dataset.id = char.id;
                
                card.innerHTML = `
                    <div class="character-icon">
                        ${char.imageUrl ? 
                            `<img src="${char.imageUrl}" alt="${char.name}">` : 
                            `<div class="character-icon-text">${char.icon}</div>`
                        }
                    </div>
                    <div class="character-name">${char.name}</div>
                    <div class="character-stats">HP: ${char.hp} | ATK: ${char.attack}</div>
                    <div class="character-description">${char.description}</div>
                `;
                
                card.addEventListener('click', () => selectOpponent(char));
                container.appendChild(card);
            });
        }
        
        // 选择对手
        function selectOpponent(opponent) {
            // 移除之前的选择状态
            document.querySelectorAll('.character-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // 设置当前选择状态
            const selectedCard = document.querySelector(`.character-card[data-id="${opponent.id}"]`);
            selectedCard.classList.add('selected');
            
            // 保存选择
            gameState.selectedOpponent = opponent;
            
            // 启用开始战斗按钮
            document.getElementById('startBattleButton').disabled = false;
        }
        
        // 开始战斗
        function startBattle() {
            if (!gameState.selectedOpponent) return;
            
            gameState.opponent = {...gameState.selectedOpponent};
            switchScreen('battle');
            updateBattleUI();
            addLogEntry(`Battle started against ${gameState.opponent.name}!`, 'system');
            showRoundInfo();
        }
        
        // 切换游戏界面
        function switchScreen(screenName) {
            // 隐藏所有界面
            Object.values(screens).forEach(screen => {
                screen.classList.remove('active');
            });
            
            // 显示目标界面
            screens[screenName].classList.add('active');
            gameState.currentScreen = screenName;
            
            // 特殊界面初始化
            if (screenName === 'battle') {
                gameState.battleLog = [];
                gameState.round = 1;
                gameState.lastLogTime = Date.now();
                gameState.userScrolledLog = false;
                gameState.playerChoice = null;
                gameState.opponentChoice = null;
                updateBattleLog();
                
                // 重置选择按钮
                document.querySelectorAll('.action-btn').forEach(btn => {
                    btn.classList.remove('selected');
                });
                
                // 禁用确认按钮
                document.getElementById('confirmButton').disabled = true;
                
                // 隐藏对手选择
                document.getElementById('opponentChoice').classList.remove('show');
                
                // 设置玩家头像
                updatePlayerAvatar();
            }
        }
        
        // 更新玩家头像
        function updatePlayerAvatar() {
            const playerIcon = document.getElementById('playerIcon');
            if (gameState.playerAvatar) {
                playerIcon.innerHTML = `<img src="${gameState.playerAvatar}" alt="Player Avatar">`;
            } else {
                playerIcon.innerHTML = '<div class="character-icon-text">👤</div>';
            }
        }
        
        // 更新战斗UI
        function updateBattleUI() {
            // 玩家信息
            const playerHp = Math.max(0, gameState.player.hp);
            document.getElementById('playerHpBar').style.width = 
                `${(playerHp / gameState.player.maxHp) * 100}%`;
            document.getElementById('playerHpText').textContent = 
                `HP: ${playerHp}/${gameState.player.maxHp}`;
            
            // 对手信息
            const opponentHp = Math.max(0, gameState.opponent.hp);
            document.getElementById('opponentName').textContent = gameState.opponent.name;
            document.getElementById('opponentIcon').innerHTML = 
                gameState.opponent.imageUrl ? 
                `<img src="${gameState.opponent.imageUrl}" alt="${gameState.opponent.name}">` : 
                `<div class="character-icon-text">${gameState.opponent.icon}</div>`;
            document.getElementById('opponentHpBar').style.width = 
                `${(opponentHp / gameState.opponent.maxHp) * 100}%`;
            document.getElementById('opponentHpText').textContent = 
                `HP: ${opponentHp}/${gameState.opponent.maxHp}`;
        }
        
        // 更新战斗日志
        function updateBattleLog() {
            const logContainer = document.getElementById('battleLog');
            logContainer.innerHTML = '';
            
            gameState.battleLog.forEach(entry => {
                const logEntry = document.createElement('div');
                logEntry.className = `log-entry ${entry.type}`;
                
                // 添加图标
                let icon = '📝';
                if (entry.type === 'player') icon = '👤';
                else if (entry.type === 'opponent') icon = '👹';
                else if (entry.type === 'damage') icon = '💥';
                
                logEntry.innerHTML = `
                    <div class="log-icon">${icon}</div>
                    <div class="log-content">
                        <div>${entry.text}</div>
                    </div>
                `;
                
                logContainer.appendChild(logEntry);
            });
            
            // 自动滚动到底部（如果用户没有手动滚动）
            if (!gameState.userScrolledLog) {
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        }
        
        // 添加日志条目
        function addLogEntry(text, type = 'system') {
            gameState.battleLog.push({
                text: `[Round ${gameState.round}] ${text}`,
                type
            });
            
            updateBattleLog();
        }
        
        // 显示回合信息
        function showRoundInfo() {
            const battleArea = document.querySelector('.battle-area');
            const roundInfo = document.createElement('div');
            roundInfo.className = 'round-info';
            roundInfo.textContent = `Round ${gameState.round}`;
            
            battleArea.appendChild(roundInfo);
            
            // 禁用所有按钮
            disableAllButtons();
            
            // 1秒后移除回合信息
            setTimeout(() => {
                roundInfo.remove();
                enableAllButtons();
                addLogEntry('Select your move...', 'system');
            }, 1000);
        }
        
        // 显示伤害信息
        function showDamageInfo(damage, isPlayerAttack) {
            const battleArea = document.querySelector('.battle-area');
            const damageElement = document.createElement('div');
            damageElement.className = 'damage-number';
            damageElement.innerHTML = `💥 -${damage} 💥`;
            damageElement.style.color = isPlayerAttack ? '#4dabf7' : '#ff6b6b';
            
            battleArea.appendChild(damageElement);
            
            // 1秒后移除伤害信息
            setTimeout(() => {
                damageElement.remove();
            }, 1000);
        }
        
        // 显示平局信息
        function showDrawInfo() {
            const battleArea = document.querySelector('.battle-area');
            const drawInfo = document.createElement('div');
            drawInfo.className = 'draw-info';
            drawInfo.textContent = 'Draw!';
            
            battleArea.appendChild(drawInfo);
            
            // 禁用所有按钮
            disableAllButtons();
            
            // 1秒后移除平局信息
            setTimeout(() => {
                drawInfo.remove();
                enableAllButtons();
                addLogEntry('Select your move...', 'system');
            }, 1000);
        }
        
        // 禁用所有按钮
        function disableAllButtons() {
            document.querySelectorAll('.action-btn, .confirm-btn').forEach(btn => {
                btn.disabled = true;
            });
        }
        
        // 启用所有按钮
        function enableAllButtons() {
            document.querySelectorAll('.action-btn').forEach(btn => {
                btn.disabled = false;
            });
            
            // 如果玩家已经选择了招式，启用确认按钮
            if (gameState.playerChoice) {
                document.getElementById('confirmButton').disabled = false;
            }
        }
        
        // 玩家选择招式
        function selectPlayerChoice(choice) {
            // 移除之前的选择状态
            document.querySelectorAll('.action-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            // 设置当前选择状态
            const selectedBtn = document.querySelector(`.action-btn[data-choice="${choice}"]`);
            selectedBtn.classList.add('selected');
            
            // 保存选择
            gameState.playerChoice = choice;
            
            // 启用确认按钮
            document.getElementById('confirmButton').disabled = false;
        }
        
        // 确认选择
        function confirmSelection() {
            // 禁用所有按钮
            disableAllButtons();
            
            // 对手AI出招
            gameState.opponentChoice = getAIChoice();
            
            // 显示对手选择
            const opponentChoiceElement = document.getElementById('opponentChoice');
            opponentChoiceElement.textContent = getChoiceSymbol(gameState.opponentChoice);
            opponentChoiceElement.classList.add('show');
            
            // 显示双方选择
            addLogEntry(`You chose: ${getChoiceName(gameState.playerChoice)}`, 'player');
            addLogEntry(`${gameState.opponent.name} chose: ${getChoiceName(gameState.opponentChoice)}`, 'opponent');
            
            // 判断胜负
            const result = determineWinner(gameState.playerChoice, gameState.opponentChoice);
            
            // 延迟执行后续动作
            setTimeout(() => {
                handleBattleResult(result);
            }, 1000);
        }
        
        // 获取AI选择（简单随机策略）
        function getAIChoice() {
            const choices = ['rock', 'paper', 'scissors'];
            return choices[Math.floor(Math.random() * choices.length)];
        }
        
        // 获取招式名称
        function getChoiceName(choice) {
            const names = {
                'rock': 'Rock',
                'paper': 'Paper',
                'scissors': 'Scissors'
            };
            return names[choice];
        }
        
        // 获取招式符号
        function getChoiceSymbol(choice) {
            const symbols = {
                'rock': '✊',
                'paper': '✋',
                'scissors': '✌️'
            };
            return symbols[choice];
        }
        
        // 判断胜负
        function determineWinner(playerChoice, opponentChoice) {
            if (playerChoice === opponentChoice) {
                return 'draw';
            }
            
            if (
                (playerChoice === 'rock' && opponentChoice === 'scissors') ||
                (playerChoice === 'paper' && opponentChoice === 'rock') ||
                (playerChoice === 'scissors' && opponentChoice === 'paper')
            ) {
                return 'win';
            }
            
            return 'lose';
        }
        
        // 处理战斗结果
        function handleBattleResult(result) {
            let damage = 0;
            let isPlayerAttack = false;
            
            switch (result) {
                case 'win':
                    damage = gameState.player.attack;
                    addLogEntry(`You won! Dealt ${damage} damage to ${gameState.opponent.name}!`, 'damage');
                    gameState.opponent.hp = Math.max(0, gameState.opponent.hp - damage);
                    isPlayerAttack = true;
                    
                    // 玩家攻击动画
                    const playerArea = document.getElementById('playerArea');
                    playerArea.classList.add('player-attacking');
                    break;
                    
                case 'lose':
                    damage = gameState.opponent.attack;
                    addLogEntry(`${gameState.opponent.name} won! Dealt ${damage} damage to you!`, 'damage');
                    gameState.player.hp = Math.max(0, gameState.player.hp - damage);
                    isPlayerAttack = false;
                    
                    // 对手攻击动画
                    const opponentArea = document.getElementById('opponentArea');
                    opponentArea.classList.add('opponent-attacking');
                    break;
                    
                case 'draw':
                    showDrawInfo();
                    addLogEntry('Draw! No damage dealt', 'system');
                    break;
            }
            
            // 显示伤害信息
            if (result !== 'draw') {
                showDamageInfo(damage, isPlayerAttack);
            }
            
            // 更新UI
            updateBattleUI();
            
            // 重置选择状态
            gameState.playerChoice = null;
            document.querySelectorAll('.action-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            document.getElementById('confirmButton').disabled = true;
            
            // 移除攻击动画
            setTimeout(() => {
                document.getElementById('playerArea').classList.remove('player-attacking');
                document.getElementById('opponentArea').classList.remove('opponent-attacking');
            }, 600);
            
            // 检查游戏是否结束
            setTimeout(() => {
                if (gameState.player.hp <= 0) {
                    endGame(false);
                } else if (gameState.opponent.hp <= 0) {
                    endGame(true);
                } else {
                    gameState.round++;
                    showRoundInfo();
                    
                    // 隐藏对手选择
                    document.getElementById('opponentChoice').classList.remove('show');
                }
            }, 1000);
        }
        
        // 结束游戏
        function endGame(isVictory) {
            const resultMessage = document.getElementById('resultMessage');
            
            if (isVictory) {
                resultMessage.textContent = 'Victory!\nChoose your path.';
                resultMessage.className = 'result-message victory';
                addLogEntry('You defeated your opponent!', 'system');
            } else {
                resultMessage.textContent = 'Defeated!\nYou are under control';
                resultMessage.className = 'result-message defeat';
                addLogEntry('You were defeated...', 'system');
            }
            
            setTimeout(() => {
                switchScreen('result');
            }, 2000);
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 出招按钮
            document.querySelectorAll('.action-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectPlayerChoice(btn.dataset.choice);
                });
            });
            
            // 确认按钮
            document.getElementById('confirmButton').addEventListener('click', confirmSelection);
            
            // 开始战斗按钮
            document.getElementById('startBattleButton').addEventListener('click', startBattle);
            
            // 返回按钮
            document.getElementById('backButton').addEventListener('click', () => {
                switchScreen('characterSelect');
            });
            
            // 重新开始按钮
            document.getElementById('restartButton').addEventListener('click', () => {
                // 重置玩家和对手状态
                gameState.player = {...characters[0]};
                gameState.opponent = null;
                gameState.selectedOpponent = null;
                switchScreen('characterSelect');
            });
            
            // 日志滚动检测
            const logContainer = document.getElementById('battleLog');
            logContainer.addEventListener('scroll', () => {
                // 如果用户滚动到顶部，标记为用户手动滚动
                if (logContainer.scrollTop < logContainer.scrollHeight - logContainer.clientHeight - 10) {
                    gameState.userScrolledLog = true;
                } 
                // 如果用户滚动到底部，恢复自动滚动
                else if (logContainer.scrollTop + logContainer.clientHeight >= logContainer.scrollHeight - 10) {
                    gameState.userScrolledLog = false;
                }
            });
            
            // 头像上传
            const avatarUpload = document.getElementById('avatarUpload');
            avatarUpload.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const avatarPreview = document.getElementById('avatarPreview');
                        avatarPreview.innerHTML = `<img src="${event.target.result}" alt="Player Avatar">`;
                        avatarPreview.classList.remove('default');
                        
                        // 保存玩家头像
                        gameState.playerAvatar = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
        
        // 启动游戏
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
